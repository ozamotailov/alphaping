<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TonSonar — баннер 640×360 для BotFather</title>
<style>
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0b1220;background:#f4f8fb;text-align:center}
  header{background:linear-gradient(135deg,#33B9FF,#0066B8);color:#fff;padding:18px}
  header h1{margin:0;font-size:18px}
  .wrap{max-width:720px;margin:0 auto;padding:22px}
  canvas{width:100%;max-width:640px;height:auto;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
  button{margin-top:18px;padding:12px 22px;border:0;border-radius:10px;background:#0066B8;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .hint{font-size:13px;color:#5a6b7b;margin-top:12px}
</style>
</head>
<body>
  <header><h1>🛰 TonSonar — баннер Mini App (640×360)</h1></header>
  <div class="wrap">
    <canvas id="cv" width="640" height="360"></canvas>
    <div><button id="dl">⬇︎ Скачать PNG 640×360</button></div>
    <p class="hint">Открой файл в браузере → «Скачать» → загрузи PNG в BotFather (/newapp → photo).</p>
  </div>
<script>
  const W = 640, H = 360;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");

  // фон — фирменный градиент
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#33B9FF"); g.addColorStop(1, "#0066B8");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // радар-лого (тот же мотив, что в logo.svg / landing)
  function logo(cx, cy, s) {
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-256, -256);
    ctx.strokeStyle = "#fff"; ctx.lineCap = "round";
    for (const [r, op] of [[87, .95], [143, .7], [199, .48]]) {
      ctx.globalAlpha = op; ctx.lineWidth = 15;
      ctx.beginPath(); ctx.arc(256, 256, r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = .85; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(256, 256); ctx.lineTo(373, 174); ctx.stroke();
    ctx.globalAlpha = 1;
    const rg = ctx.createRadialGradient(373, 174, 0, 373, 174, 46);
    rg.addColorStop(0, "rgba(160,228,255,0.9)"); rg.addColorStop(1, "rgba(160,228,255,0)");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(373, 174, 46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(256, 256, 22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(373, 174, 14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  logo(140, 180, 0.42);

  // текст
  ctx.fillStyle = "#fff"; ctx.textAlign = "left";
  ctx.font = "800 62px 'Segoe UI',Roboto,system-ui,-apple-system,Arial,sans-serif";
  ctx.fillText("TonSonar", 256, 178);
  ctx.globalAlpha = .92;
  ctx.font = "500 23px 'Segoe UI',Roboto,system-ui,-apple-system,Arial,sans-serif";
  ctx.fillText("Smart-money radar for TON", 258, 216);
  ctx.globalAlpha = 1;

  document.getElementById("dl").onclick = () => {
    const a = document.createElement("a");
    a.download = "tonsonar-640x360.png";
    a.href = cv.toDataURL("image/png");
    a.click();
  };
</script>
</body>
</html>
