<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TonSonar — компоновщик скриншотов</title>
<style>
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0b1220;background:#f4f8fb}
  header{background:linear-gradient(135deg,#33B9FF,#0066B8);color:#fff;padding:20px}
  header h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;opacity:.92;font-size:13px}
  .wrap{max-width:1000px;margin:0 auto;padding:20px;display:grid;grid-template-columns:320px 1fr;gap:24px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  label{display:block;font-weight:700;margin:14px 0 6px}
  label:first-child{margin-top:0}
  select,input[type=file]{width:100%;padding:8px;border:1px solid #cdd9e5;border-radius:8px;background:#fff;font:inherit}
  .radio{display:flex;gap:14px;margin-top:6px}
  .radio label{font-weight:500;margin:0;display:flex;align-items:center;gap:6px}
  button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:#0066B8;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .hint{font-size:12px;color:#5a6b7b;margin-top:10px}
  .preview{display:flex;justify-content:center;align-items:flex-start}
  canvas{width:100%;max-width:340px;height:auto;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.15);background:#dde6ee}
</style>
</head>
<body>
  <header>
    <h1>🛰 TonSonar — компоновщик скриншотов</h1>
    <p>Скриншот + фирменная плашка → готовый PNG 1080×1920 для tApps Center. Всё локально в браузере.</p>
  </header>
  <div class="wrap">
    <div class="panel">
      <label>1. Скриншот (из Telegram)</label>
      <input type="file" id="file" accept="image/*"/>

      <label>2. Слот / подпись</label>
      <select id="slot">
        <option value="0">1 — Catch smart money / the second it moves</option>
        <option value="1">2 — Curated TON smart money / scored by real PnL</option>
        <option value="2">3 — New listings, with a / built-in scam check</option>
        <option value="3">4 — From signal to swap / in one tap</option>
        <option value="4">5 — Your TON holdings & PnL / at a glance</option>
        <option value="5">6 — Read-only. / Your keys stay yours</option>
      </select>

      <label>3. Положение плашки</label>
      <div class="radio">
        <label><input type="radio" name="pos" value="bottom" checked/> снизу</label>
        <label><input type="radio" name="pos" value="top"/> сверху</label>
      </div>

      <button id="dl" disabled>⬇︎ Скачать PNG</button>
      <p class="hint">Скриншот вписывается по принципу «cover» (масштаб + центр-кроп) в 1080×1920.
        Если плашка перекрывает важное (напр. кнопку Buy) — переключи положение.</p>
    </div>

    <div class="preview"><canvas id="cv" width="1080" height="1920"></canvas></div>
  </div>

<script>
  // Подписи слотов: [строка1, строка2, размер шрифта]. Совпадают со store/captions/*.svg.
  const CAPS = [
    ["Catch smart money", "the second it moves", 64],
    ["Curated TON smart money", "scored by real PnL", 60],
    ["New listings, with a", "built-in scam check", 62],
    ["From signal to swap", "in one tap", 64],
    ["Your TON holdings & PnL", "at a glance", 60],
    ["Read-only.", "Your keys stay yours", 64],
  ];
  const W = 1080, H = 1920, BAND = 360;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const fileEl = document.getElementById("file"), slotEl = document.getElementById("slot"), dlEl = document.getElementById("dl");
  let img = null;

  function pos() { return document.querySelector('input[name=pos]:checked').value; }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // фон-плейсхолдер, пока нет картинки
    if (!img) { ctx.fillStyle = "#dde6ee"; ctx.fillRect(0, 0, W, H); }
    else {
      const s = Math.max(W / img.width, H / img.height);
      const w = img.width * s, h = img.height * s;
      ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
    }
    // плашка
    const top = pos() === "top" ? 0 : H - BAND;
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, "#33B9FF"); grad.addColorStop(1, "#0066B8");
    ctx.fillStyle = grad;
    ctx.fillRect(0, top, W, BAND);
    // текст
    const [l1, l2, size] = CAPS[+slotEl.value];
    ctx.textAlign = "center"; ctx.fillStyle = "#fff";
    ctx.font = `800 ${size}px 'Segoe UI', Roboto, system-ui, -apple-system, Arial, sans-serif`;
    ctx.fillText(l1, W / 2, top + 130);
    ctx.fillText(l2, W / 2, top + 212);
    ctx.font = `600 30px 'Segoe UI', Roboto, system-ui, -apple-system, Arial, sans-serif`;
    ctx.globalAlpha = .85;
    ctx.fillText("🛰 TonSonar", W / 2, top + 302);
    ctx.globalAlpha = 1;
  }

  fileEl.addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const im = new Image();
    im.onload = () => { img = im; dlEl.disabled = false; draw(); };
    im.src = URL.createObjectURL(f);
  });
  slotEl.addEventListener("change", draw);
  document.querySelectorAll('input[name=pos]').forEach((r) => r.addEventListener("change", draw));
  dlEl.addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "shot-" + (+slotEl.value + 1) + ".png";
    a.href = cv.toDataURL("image/png");
    a.click();
  });
  draw();
</script>
</body>
</html>
