# Локальная инфраструктура для разработки: Postgres + Redis.
# Запуск:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alphaping
      POSTGRES_PASSWORD: alphaping
      POSTGRES_DB: alphaping
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
